<body><div id="root"></div><div id="toast" class="toast"></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"></div>
<script>
const API='api/index.php?r=';const state={user:null,section:'dashboard',rows:[],current:null,theme:localStorage.getItem('mreport-theme')||'dark1'};
const nav=[['dashboard','⌂','داشبورد اجرایی'],['customers','♙','مشتریان'],['goods','▦','کالاها'],['inventory','▤','موجودی انبار'],['invoices','▤','فاکتورها'],['unpaid','◔','مطالبات'],['checks','✓','چک‌ها'],['finance','◈','مالی و فروش'],['messages','✉','پیام‌ها'],['company','▣','اطلاعات شرکت'],['alerts','⚠','مرکز هشدار هوشمند'],['notifications','🔔','Notification Center'],['reportbuilder','▥','گزارش‌ساز اختصاصی'],['settings','⚙','تنظیمات و اعلان‌ها']];
const themes=[['dark1','Obsidian Neon','تیره'],['dark2','Royal Gold','تیره'],['light1','Pearl Azure','روشن'],['light2','Ivory Sage','روشن']];
function applyTheme(){document.documentElement.dataset.theme=state.theme==='dark1'?'':state.theme;localStorage.setItem('mreport-theme',state.theme)}applyTheme();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function num(v){return Number(v||0).toLocaleString('fa-IR')}function money(v){return num(Math.round(Number(v||0)))+' ریال'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',3000)}
async function api(route,body={}){const r=await fetch(API+encodeURIComponent(route),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:false,message:'پاسخ نامعتبر'}));if(!r.ok||!j.ok)throw Error(j.message||'خطا');return j.data??j}
function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginBox"><div class="loginLogo">M</div><h1>M•REPORT</h1><p>Executive Reporting • Milano Studio Design</p><div class="loginForm"><label>نام کاربری آتیران</label><input id="u" class="input" autocomplete="username"><label>رمز عبور</label><input id="p" type="password" class="input" autocomplete="current-password"><button class="btn primary" onclick="doLogin()">ورود امن به مرکز گزارش</button></div><div class="loginFoot">Milano Studio Design • طراحی و توسعه: میلادی عقیلی</div></div></div>`}
async function doLogin(){try{const d=await api('login',{username:document.getElementById('u').value,password:document.getElementById('p').value});state.user=d;render();toast('ورود موفق بود')}catch(e){toast(e.message)}}
function shell(){document.getElementById('root').innerHTML=`<div class="app"><aside id="side" class="side"><div class="brand"><div class="mark">M</div><div><b>M•REPORT</b><small>Executive Intelligence</small></div></div><div class="nav">${nav.map(n=>`<button class="${state.section===n[0]?'active':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}</div><div class="sideFooter">Milano Studio Design<br>طراحی و توسعه: میلادی عقیلی<br>Read Only • Atiran Reports<br><button class="btn" style="width:100%;margin-top:8px" onclick="cycleTheme()">🎨 تغییر تم</button></div></aside><main class="main"><header class="top"><div style="display:flex;gap:8px"><button class="btn mobileMenu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="title"><h1>${nav.find(x=>x[0]===state.section)?.[2]||'داشبورد'}</h1><p>گزارش مدیریتی دقیق • داده‌های خواندنی از سرویس آتیران</p></div></div><div class="actions"><button class="btn hideMobile" onclick="openReminders()">⏰ یادآورها</button><button class="btn hideMobile" onclick="toggleSound()">🔊 صدا</button><button class="btn hideMobile" onclick="loadSection()">↻ بروزرسانی</button><button class="btn primary" onclick="logout()">خروج</button></div></header><section id="content"></section></main></div>`}
function cycleTheme(){state.theme=themes[(themes.findIndex(t=>t[0]===state.theme)+1)%themes.length][0];applyTheme();shell();loadSection();toast('تم: '+themes.find(t=>t[0]===state.theme)[1])}
async function logout(){await api('logout').catch(()=>{});state.user=null;login()}
async function go(s){state.section=s;document.getElementById('side')?.classList.remove('open');shell();loadSection()}
function loading(){document.getElementById('content').innerHTML='<div class="panel"><div class="panelBody" style="padding:45px;text-align:center;color:var(--muted)">در حال دریافت اطلاعات واقعی از آتیران…</div></div>'}
function table(rows,cols,withActions=false){if(!Array.isArray(rows)||!rows.length)return '<div style="padding:35px;text-align:center;color:var(--muted)">داده‌ای برای نمایش وجود ندارد.</div>';return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${withActions?'<th class="noPrint">عملیات</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-row="${i}">${cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join('')}${withActions?`<td class="noPrint"><div class="rowActions"><button class="iconBtn" title="جزئیات" onclick="openCustomer(${i})">⌁</button><button class="iconBtn" title="تماس" onclick="callRow(${i})">☎</button><button class="iconBtn" title="پیام" onclick="smsRow(${i})">✉</button><button class="iconBtn" title="یادآور" onclick="remindRow(${i})">⏰</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
const configs={customers:{route:'customers',title:'مشتریان',cols:[['Shmo','شماره'],['Moname','نام مشتری'],['Cell','موبایل'],['Tel1','تلفن'],['Credit','اعتبار'],['Man','مانده'],['GroupRdf','گروه'],['Active','فعال']],actions:true},goods:{route:'goods',title:'کالاها',cols:[['Shka','کد کالا'],['NaKa','نام کالا'],['Coka','کد خارجی'],['VahSanj','واحد'],['FinalSalePrice','قیمت فروش'],['GroupRdf','گروه'],['Active','فعال']]},inventory:{route:'inventory',title:'موجودی انبار',cols:[['shka','کد کالا'],['name','نام کالا'],['AnbName','انبار'],['Moj','موجودی'],['mojkavah','موجودی واحد'],['tedbastebandi','بسته‌بندی']]},invoices:{route:'invoices',title:'فاکتورها',cols:[['ShFact','شماره فاکتور'],['Date','تاریخ'],['ShMo','مشتری'],['AllFel','مبلغ کل'],['MabDaryaftFactor','دریافت'],['Tdf','تخفیف']]},unpaid:{route:'unpaid',title:'مطالبات',cols:[['ShFact','شماره فاکتور'],['Date','تاریخ'],['ShMo','مشتری'],['AllFel','مبلغ کل'],['MabDaryaftFactor','دریافت'],['Tdf','تخفیف']]},checks:{route:'checks',title:'چک‌ها',cols:[['Id','شناسه'],['Date','تاریخ'],['SarDate','سررسید'],['Bank','بانک'],['Shobe','شعبه'],['Serial','سریال'],['Mablagh','مبلغ'],['shmo','مشتری'],['Status','وضعیت']]},messages:{route:'messages',title:'پیام‌ها',cols:[['Id','شناسه'],['Title','عنوان'],['CreateDate','تاریخ'],['CreateTime','ساعت'],['isImportant','مهم'],['Status','وضعیت']]}};
async function loadSection(){if(!state.user)return login();loading();try{let html;if(state.section==='dashboard')html=await dashboard();else if(state.section==='finance')html=await finance();else if(state.section==='company')html=await company();else if(state.section==='settings')html=settings();else if(state.section==='alerts')html=await alertsCenter();else if(state.section==='notifications')html=notificationCenter();else if(state.section==='reportbuilder')html=reportBuilder();else html=await listing(state.section);document.getElementById('content').innerHTML=html}catch(e){document.getElementById('content').innerHTML=`<div class="panel"><div class="panelBody" style="padding:40px;text-align:center" class="bad">${esc(e.message)}<br><button class="btn" style="margin-top:10px" onclick="loadSection()">تلاش مجدد</button></div></div>`}}
async function dashboard(){const c=await api('counts');const unpaid=await api('unpaid').catch(()=>[]);const checks=await api('checks').catch(()=>[]);const rows=Array.isArray(unpaid)?unpaid:[];const checkRows=Array.isArray(checks)?checks:[];const receivable=rows.reduce((s,x)=>s+Number(x.AllFel||0)-Number(x.MabDaryaftFactor||0),0);const metrics=[['مشتریان',Number(c.customers||0)],['کالاها',Number(c.goods||0)],['مطالبات',Math.max(0,receivable)],['چک‌ها',checkRows.length]];const max=Math.max(...metrics.map(x=>x[1]),1);const overdue=checkRows.filter(isDueCheck).length;notifyBusinessEvents({overdue,unpaid:rows.length});return `<div class="sectionIntro"><div><h2>نمای اجرایی M•REPORT</h2><p>اطلاعات زنده آتیران، با چارت‌های فشرده و مناسب تصمیم‌گیری سریع.</p></div><span class="pill good">● سرویس فعال • Read Only</span></div><div class="cards">${metrics.map((x,i)=>`<div class="card fxCard"><span class="label">${x[0]}</span><div class="metric" style="font-size:${i===2?'18px':'26px'}">${i===2?money(x[1]):num(x[1])}</div><span class="pill" style="margin-top:8px">داده واقعی API</span></div>`).join('')}</div><div class="grid"><div class="panel"><div class="panelHead"><b>چارت شاخص‌های کلیدی</b><span class="pill">پویا از داده فعلی</span></div><div class="panelBody"><div class="metricBars">${metrics.map(x=>`<div class="metricBar" style="height:${Math.max(9,(x[1]/max)*82)}%"><label>${x[0]}</label><em>${x[0]==='مطالبات'?money(x[1]):num(x[1])}</em></div>`).join('')}</div></div></div><div class="panel"><div class="panelHead"><b>ترکیب مدیریتی</b><span class="pill">نمایش فشرده</span></div><div class="panelBody"><div class="chartSplit"><div class="ringWrap"><div class="ring"></div></div><div class="legend"><span><i class="dot"></i>مشتریان: ${num(c.customers)}</span><span><i class="dot" style="background:var(--b)"></i>کالاها: ${num(c.goods)}</span><span><i class="dot" style="background:var(--good)"></i>چک‌ها: ${num(checkRows.length)}</span><span><i class="dot" style="background:var(--warn)"></i>مطالبات: ${money(receivable)}</span></div></div></div></div></div><div class="grid"><div class="panel"><div class="panelHead"><b>هشدارهای هوشمند</b><span class="pill ${overdue?'warn':'good'}">${overdue?'نیازمند توجه':'وضعیت پایدار'}</span></div><div class="panelBody" style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px"><div class="miniStat"><b>${num(overdue)}</b><span>چک‌های نیازمند بررسی</span></div><div class="miniStat"><b>${num(rows.length)}</b><span>رکورد مطالبات</span></div><div class="miniStat"><b>${num(reminders().length)}</b><span>یادآور فعال</span></div></div></div><div class="panel"><div class="panelHead"><b>دسترسی سریع</b></div><div class="panelBody" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['customers','مشتریان'],['invoices','فاکتورها'],['unpaid','مطالبات'],['checks','چک‌ها']].map(x=>`<button class="btn" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}<button class="btn primary" onclick="go('settings')">⚙ تنظیمات اعلان</button></div></div></div>`}
async function listing(s){const x=configs[s];if(!x)throw Error('گزارش شناخته نشد');const d=await api(x.route,{start:0,fetch:1000});state.rows=Array.isArray(d)?d:[];const search=s==='customers'?'جستجوی نام، شماره مشتری، موبایل…':s==='goods'?'جستجوی کد، نام یا کد خارجی کالا…':'جستجوی سریع…';return `<div class="panel"><div class="panelHead"><b>${x.title}</b><span class="pill">${num(state.rows.length)} ردیف • داده واقعی</span></div><div class="panelBody">${s==='customers'||s==='goods'?`<div class="searchHero"><input id="smartSearch" class="input" placeholder="${search}" oninput="smartEntitySearch('${s}',this.value)"><button class="btn primary" onclick="smartEntitySearch('${s}',document.getElementById('smartSearch').value)">جستجو</button></div>`:''}<div class="filters"><input class="input" placeholder="جستجوی سریع…" oninput="filterTable(this)"><button class="btn" onclick="printReport()">🖨 چاپ</button><button class="btn" onclick="exportCSV()">CSV</button><button class="btn" onclick="exportExcel()">Excel</button><button class="btn" onclick="exportWord()">Word</button><button class="btn" onclick="exportPDF()">PDF</button><button class="btn" onclick="shareCurrent()">↗ اشتراک‌گذاری</button>${s==='customers'?'<button class="btn primary" onclick="go(\'reportbuilder\')">▥ گزارش اختصاصی</button>':''}</div><div id="reportTable">${table(state.rows,x.cols,!!x.actions)}</div></div></div>`}
function smartEntitySearch(type,q){q=String(q||'').trim().toLowerCase();const rows=state.rows.filter(r=>{const vals=type==='customers'?[r.Shmo,r.Moname,r.Cell,r.Tel1,r.Tel2]:[r.Shka,r.NaKa,r.Coka,r.GroupRdf];return !q||vals.some(v=>String(v??'').toLowerCase().includes(q))});const x=configs[type];document.getElementById('reportTable').innerHTML=table(rows,x.cols,!!x.actions)}

function filterTable(inp){const q=inp.value.toLowerCase();document.querySelectorAll('#reportTable tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function csvText(){const t=document.querySelector('#reportTable .table');if(!t)return '';return [...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replaceAll('"','""')+'"').join(',')).join('\n')}
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){downloadBlob('mreport.csv',new Blob(['\ufeff'+csvText()],{type:'text/csv;charset=utf-8'}));toast('CSV ساخته شد')}
function exportExcel(){const t=document.querySelector('#reportTable .table');if(!t)return;downloadBlob('mreport.xls',new Blob(['\ufeff<html dir="rtl"><meta charset="utf-8"><table>'+t.innerHTML+'</table></html>'],{type:'application/vnd.ms-excel;charset=utf-8'}));toast('Excel ساخته شد')}
function exportWord(){const t=document.querySelector('#reportTable .table');if(!t)return;downloadBlob('mreport.doc',new Blob(['<html dir="rtl"><meta charset="utf-8"><body><h2>M•REPORT</h2><table border="1" cellspacing="0" cellpadding="5">'+t.innerHTML+'</table><p>Milano Studio Design • میلادی عقیلی</p></body></html>'],{type:'application/msword'}));toast('Word ساخته شد')}
function exportPDF(){printReport()}
function printReport(){window.print()}
async function shareCurrent(){const text='گزارش M•REPORT • Milano Studio Design';const csv=csvText();if(!csv){toast('گزارشی برای اشتراک وجود ندارد');return}const file=new File([new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})],'MReport.csv',{type:'text/csv'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'M•REPORT',text,files:[file]});toast('پنل اشتراک‌گذاری دستگاه باز شد')}else{window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+location.href),'_blank');toast('اشتراک فایل در دستگاه پشتیبانی نشد؛ لینک باز شد')}}catch(e){if(e.name!=='AbortError')toast('اشتراک‌گذاری لغو یا ناموفق بود')}}
function callRow(i){const r=state.rows[i]||{};const p=r.Cell||r.Tel1||r.Tel2;if(!p)return toast('شماره تماس ثبت نشده است');location.href='tel:'+String(p).replace(/[^0-9+]/g,'')}
function smsRow(i){const r=state.rows[i]||{};const p=r.Cell||r.Tel1;if(!p)return toast('شماره موبایل ثبت نشده است');location.href='sms:'+String(p).replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent('سلام '+(r.Moname||'')+'،')}
async function openCustomer(i){const r=state.rows[i]||{};const shmo=r.Shmo||r.shmo;if(!shmo)return toast('شماره مشتری موجود نیست');try{const c=await api('customer',{shmo:String(shmo)});const checks=await api('customer.checks',{shmo:String(shmo)}).catch(()=>[]);state.current={customer:c,checks:Array.isArray(checks)?checks:[]};const phone=c.Cell||c.Tel1||c.Tel2||r.Cell||r.Tel1||'';document.getElementById('drawer').innerHTML=`<div class="drawerPanel"><div class="drawerHead"><b>پرونده مشتری</b><button class="iconBtn" onclick="closeDrawer()">×</button></div><div class="detailHero"><div style="font-size:21px;font-weight:800">${esc(c.Moname||r.Moname||'مشتری')}</div><div style="color:var(--muted);font-size:10px;margin-top:5px">شماره مشتری: ${esc(c.Shmo||shmo)}</div></div><div class="contactGrid"><button class="contactBtn primary" onclick="callCurrent()">☎ تماس</button><button class="contactBtn" onclick="smsCurrent()">✉ پیام</button><button class="contactBtn" onclick="remindCurrent()">⏰ یادآور</button><button class="contactBtn" onclick="printCustomer()">🖨 چاپ</button><button class="contactBtn" onclick="exportCustomerExcel()">▦ Excel</button><button class="contactBtn" onclick="shareCustomer()">↗ اشتراک</button></div><div class="detailSection"><h3>اطلاعات مشتری</h3><div class="kv"><div><span>موبایل</span>${esc(c.Cell||'-')}</div><div><span>تلفن</span>${esc(c.Tel1||'-')}</div><div><span>آدرس</span>${esc(c.Address||'-')}</div><div><span>اعتبار</span>${money(c.Credit)}</div><div><span>مانده</span>${money(c.Man)}</div><div><span>گروه</span>${esc(c.GroupRdf||'-')}</div></div></div><div class="detailSection"><h3>گردش حساب مشتری</h3><div class="resultTabs"><button class="tabBtn active" onclick="showCustomerLedger('acts')">گردش حساب</button><button class="tabBtn" onclick="showCustomerLedger('invoices')">فاکتورها</button><button class="tabBtn" onclick="showCustomerLedger('checks')">چک‌ها</button></div><div id="customerLedger">در حال آماده‌سازی…</div></div><div class="detailSection"><h3>یادآور مشتری</h3><div class="reminder"><div class="reminderRow"><input id="remDate" type="datetime-local" class="input"><button class="btn primary" onclick="saveCurrentReminder()">ثبت یادآور</button></div><small style="color:var(--muted)">در صورت اجازه کاربر، نوتیفیکیشن مرورگر نمایش داده می‌شود.</small></div></div><div class="printOnly"><h2>M•REPORT — ${esc(c.Moname||r.Moname||'')}</h2><p>Milano Studio Design • میلادی عقیلی</p></div></div>`;document.getElementById('drawer').classList.add('open');showCustomerLedger('acts')}catch(e){toast(e.message)}}

async function showCustomerLedger(kind){const box=document.getElementById('customerLedger');if(!box)return;const c=state.current?.customer||{},shmo=c.Shmo||state.current?.row?.Shmo||'';if(!shmo)return box.innerHTML='<div style="color:var(--muted)">شماره مشتری در داده واقعی پیدا نشد.</div>';box.innerHTML='<div style="padding:18px;text-align:center;color:var(--muted)">در حال دریافت داده واقعی…</div>';try{let d,cols;if(kind==='checks'){d=await api('customer.checks',{shmo});cols=[['Date','تاریخ'],['SarDate','سررسید'],['Bank','بانک'],['Serial','سریال'],['Mablagh','مبلغ'],['Status','وضعیت']]}else if(kind==='invoices'){d=await api('invoices',{shmo});cols=configs.invoices.cols}else{d=await api('customer.acts',{shmo,beginDate:'1900/01/01',endDate:'2999/12/29'});cols=Array.isArray(d)&&d.length?Object.keys(d[0]).slice(0,10).map(k=>[k,k]):[['ShFact','شماره'],['Date','تاریخ'],['AllFel','مبلغ']]}box.innerHTML=Array.isArray(d)&&d.length?table(d,cols,false):'<div style="padding:20px;text-align:center;color:var(--muted)">گردشی برای نمایش وجود ندارد.</div>'}catch(e){box.innerHTML='<div style="color:var(--bad)">'+esc(e.message)+'</div>'}}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function callCurrent(){const c=state.current?.customer||{};const p=c.Cell||c.Tel1||c.Tel2;if(!p)return toast('شماره ثبت نشده');location.href='tel:'+String(p).replace(/[^0-9+]/g,'')}
function smsCurrent(){const c=state.current?.customer||{};const p=c.Cell||c.Tel1;if(!p)return toast('شماره موبایل ثبت نشده');location.href='sms:'+String(p).replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent('سلام '+(c.Moname||'')+'،')}
function printCustomer(){window.print()}
function exportCustomerExcel(){const c=state.current?.customer||{};const html=`<table><tr><th>فیلد</th><th>مقدار</th></tr>${Object.entries(c).slice(0,40).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;downloadBlob('customer.xls',new Blob(['\ufeff<html dir="rtl"><meta charset="utf-8">'+html+'</html>'],{type:'application/vnd.ms-excel;charset=utf-8'}));toast('فایل Excel مشتری ساخته شد')}
async function shareCustomer(){const c=state.current?.customer||{};const txt=`مشتری: ${c.Moname||''}\nشماره: ${c.Shmo||''}\nتلفن: ${c.Cell||c.Tel1||''}\nمانده: ${c.Man||0}`;try{if(navigator.share){await navigator.share({title:'M•REPORT',text:txt})}else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}catch(e){}}

async function alertsCenter(){const [checks,unpaid]=await Promise.all([api('checks').catch(()=>[]),api('unpaid').catch(()=>[])]);const cr=Array.isArray(checks)?checks:[],ur=Array.isArray(unpaid)?unpaid:[],overdue=cr.filter(isDueCheck),amount=ur.reduce((s,x)=>s+Math.max(0,Number(x.AllFel||0)-Number(x.MabDaryaftFactor||0)),0);return `<div class="sectionIntro"><div><h2>مرکز هشدار هوشمند</h2><p>هشدارها از داده‌های واقعی آتیران استخراج می‌شوند.</p></div><button class="btn primary" onclick="go('notifications')">🔔 اعلان‌ها</button></div><div class="alertGrid"><div class="alertCard ${overdue.length?'danger':''}"><span class="label">چک‌های سررسید / حساس</span><div class="big">${num(overdue.length)}</div><small>بررسی فوری</small></div><div class="alertCard ${ur.length?'warnBox':''}"><span class="label">مطالبات باز</span><div class="big">${num(ur.length)}</div><small>${money(amount)}</small></div><div class="alertCard"><span class="label">یادآورهای مشتری</span><div class="big">${num(reminders().length)}</div><small>یادآورهای ثبت‌شده</small></div></div><div class="panel" style="margin-top:15px"><div class="panelHead"><b>اقدامات پیشنهادی</b><span class="pill">Read Only</span></div><div class="panelBody noticeList"><div class="notice"><div class="noticeLeft"><span class="ico">✓</span><div><b>چک‌ها</b><small style="display:block;color:var(--muted)">مشاهده چک‌های سررسید شده</small></div></div><button class="btn" onclick="go('checks')">مشاهده</button></div><div class="notice"><div class="noticeLeft"><span class="ico">◔</span><div><b>مطالبات</b><small style="display:block;color:var(--muted)">مشاهده فاکتورهای باز</small></div></div><button class="btn" onclick="go('unpaid')">مشاهده</button></div></div></div>`}
function notificationCenter(){const p=getPrefs(),a=reminders().slice().sort((x,y)=>new Date(x.when)-new Date(y.when));return `<div class="sectionIntro"><div><h2>Notification Center</h2><p>مرکز واحد اعلان‌ها، یادآورها و وضعیت کانال‌ها.</p></div><span class="pill ${('Notification' in window&&Notification.permission==='granted')?'good':'warn'}">${('Notification' in window&&Notification.permission==='granted')?'● مجوز اعلان فعال':'● نیازمند مجوز'}</span></div><div class="grid"><div class="panel"><div class="panelHead"><b>کانال‌های اعلان</b></div><div class="panelBody noticeList">${[['overdueChecks','چک‌های سررسید'],['unpaid','مطالبات و فاکتورهای باز'],['customerReminders','یادآور مشتری'],['system','اعلان سیستمی']].map(([k,t])=>`<div class="notice"><div class="noticeLeft"><span class="ico">🔔</span><b>${t}</b></div><span class="pill ${p[k]?'good':'bad'}">${p[k]?'فعال':'خاموش'}</span></div>`).join('')}</div></div><div class="panel"><div class="panelHead"><b>یادآورهای آینده</b><span class="pill">${num(a.length)}</span></div><div class="panelBody noticeList">${a.length?a.slice(0,8).map(x=>`<div class="notice"><div><b>${esc(x.text)}</b><small style="display:block;color:var(--muted)">${new Date(x.when).toLocaleString('fa-IR')}</small></div><button class="iconBtn" onclick="removeReminder(${x.id})">×</button></div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:20px">یادآوری فعالی وجود ندارد.</div>'}</div></div></div>`}
function removeReminder(id){saveReminders(reminders().filter(x=>x.id!==id));loadSection()}
function reportBuilder(){return `<div class="sectionIntro"><div><h2>گزارش‌ساز اختصاصی M•REPORT</h2><p>نوع گزارش، فیلتر و نوع خروجی را انتخاب کنید؛ داده‌ها زنده و Read Only هستند.</p></div><span class="pill good">Live Data</span></div><div class="panel"><div class="panelHead"><b>ساخت گزارش</b><span class="pill">پیش‌فرض: خلاصه مدیریتی</span></div><div class="panelBody"><div class="builderGrid"><div class="builderField"><label>نوع گزارش</label><select id="rbType" class="select" onchange="previewBuilder()"><option value="customers">مشتریان</option><option value="goods">کالاها</option><option value="inventory">موجودی انبار</option><option value="checks">چک‌ها</option><option value="unpaid">مطالبات</option></select></div><div class="builderField"><label>فیلتر</label><input id="rbQuery" class="input" placeholder="نام، کد، شماره…" oninput="previewBuilder()"></div><div class="builderField"><label>عنوان گزارش</label><input id="rbTitle" class="input" value="گزارش مدیریتی M•REPORT"></div><div class="builderField"><label>خروجی</label><select id="rbOut" class="select"><option value="pdf">PDF / چاپ</option><option value="excel">Excel</option><option value="word">Word</option><option value="csv">CSV</option></select></div></div><div class="filters" style="margin-top:14px"><button class="btn primary" onclick="previewBuilder()">پیش‌نمایش</button><button class="btn" onclick="buildCustomReport()">ساخت خروجی</button></div><div id="builderPreview" class="builderPreview"></div></div></div>`}
async function previewBuilder(){const type=document.getElementById('rbType')?.value||'customers',q=(document.getElementById('rbQuery')?.value||'').toLowerCase();try{const d=await api(configs[type].route,{start:0,fetch:1000});let rows=Array.isArray(d)?d:[];if(q)rows=rows.filter(r=>Object.values(r||{}).some(v=>String(v??'').toLowerCase().includes(q)));state.builderRows=rows;const title=esc(document.getElementById('rbTitle')?.value||'گزارش مدیریتی M•REPORT');document.getElementById('builderPreview').innerHTML=`<div class="brandReport"><h2>${title}</h2><small>Milano Studio Design • خلاصه مدیریتی • ${new Date().toLocaleDateString('fa-IR')} • ${num(rows.length)} ردیف واقعی</small></div>${table(rows,configs[type].cols,false)}`}catch(e){toast(e.message)}}
function buildCustomReport(){if(!state.builderRows?.length)return toast('ابتدا پیش‌نمایش گزارش را بسازید');const out=document.getElementById('rbOut')?.value,title=document.getElementById('rbTitle')?.value||'M•REPORT',type=document.getElementById('rbType')?.value||'customers',cols=configs[type].cols,html=`<div class="brandReport"><h2>${esc(title)}</h2><small>Milano Studio Design • ${new Date().toLocaleDateString('fa-IR')}</small></div>${table(state.builderRows,cols,false)}`;if(out==='pdf'){const w=window.open('','_blank');if(w){w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font-family:Arial;padding:30px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #ddd;padding:7px}</style></head><body>'+html+'</body></html>');w.document.close();w.print()}}else if(out==='excel')downloadBlob('mreport-custom.xls',new Blob(['\ufeff<html dir="rtl"><meta charset="utf-8">'+html+'</html>'],{type:'application/vnd.ms-excel;charset=utf-8'}));else if(out==='word')downloadBlob('mreport-custom.doc',new Blob(['<html dir="rtl"><meta charset="utf-8">'+html+'</html>'],{type:'application/msword'}));else downloadBlob('mreport-custom.csv',new Blob(['\ufeff'+rowsToCSV(state.builderRows,cols)],{type:'text/csv;charset=utf-8'}));toast('گزارش اختصاصی آماده شد')}
function rowsToCSV(rows,cols){return [cols.map(c=>c[1]).join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c[0]]??'').replaceAll('"','""')+'"').join(','))].join('\n')}
function getPrefs(){return JSON.parse(localStorage.getItem('mreport-prefs')||'{"overdueChecks":true,"unpaid":true,"customerReminders":true,"system":true,"sound":true,"effects":true}')}function savePrefs(p){localStorage.setItem('mreport-prefs',JSON.stringify(p))}function setPref(k,v){const p=getPrefs();p[k]=v;savePrefs(p);document.documentElement.dataset.fx=p.effects?'on':'off';if(k==='sound'&&v)playTone('soft');toast(v?'فعال شد':'خاموش شد')}function prefSwitch(k){return `<button class="switch ${getPrefs()[k]?'on':''}" onclick="setPref('${k}',!getPrefs()['${k}']);renderSettings()"><i></i></button>`}function renderSettings(){if(state.section==='settings')document.getElementById('content').innerHTML=settings()}function settings(){return `<div class="sectionIntro"><div><h2>مرکز تنظیمات و اعلان‌ها</h2><p>اعلان‌های مهم، صدا و افکت‌ها را بدون شلوغ‌کردن محیط کنترل کنید.</p></div><div class="soundOrb"><span>✦</span></div></div><div class="grid"><div class="panel"><div class="panelHead"><b>اعلان‌های هوشمند</b><span class="pill">روشن / خاموش</span></div><div class="panelBody"><div class="settingGrid"><div class="settingItem"><div><b>چک‌های سررسید / نیازمند بررسی</b><small>هشدار برای چک‌هایی که وضعیت سررسید، معوق یا حساس دارند.</small></div>${prefSwitch('overdueChecks')}</div><div class="settingItem"><div><b>مطالبات و فاکتورهای باز</b><small>اعلان وجود رکوردهای مطالبات قابل پیگیری.</small></div>${prefSwitch('unpaid')}</div><div class="settingItem"><div><b>یادآور اختصاصی مشتری</b><small>یادآورهای ثبت‌شده برای تماس و پیگیری.</small></div>${prefSwitch('customerReminders')}</div><div class="settingItem"><div><b>اعلان‌های سیستمی</b><small>اتصال، خطا و وضعیت سرویس.</small></div>${prefSwitch('system')}</div></div></div></div><div class="panel"><div class="panelHead"><b>تجربه صوتی و بصری</b><span class="pill">لوکس اما کنترل‌شده</span></div><div class="panelBody"><div class="settingGrid"><div class="settingItem"><div><b>صداهای ظریف رابط</b><small>بازخورد کوتاه برای عملیات مهم، بدون صدای آزاردهنده.</small></div>${prefSwitch('sound')}</div><div class="settingItem"><div><b>افکت‌های حرکتی و عمق 3D</b><small>نور، عمق کارت‌ها و انیمیشن‌های نرم.</small></div>${prefSwitch('effects')}</div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:16px"><div><b style="font-size:11px">پیش‌نمایش صدا</b><small style="display:block;color:var(--muted);font-size:9px;margin-top:4px">یک صدای کوتاه و ظریف برای تجربه رابط.</small></div><div style="display:flex;gap:7px"><button class="btn" onclick="requestNotify();toast('درخواست مجوز اعلان ارسال شد')">🔔 مجوز اعلان</button><button class="btn primary" onclick="playTone('success')">▶ پخش</button></div></div></div></div></div><div class="panel" style="margin-top:15px"><div class="panelHead"><b>مسیر ارتقای نسخه نهایی</b><span class="pill good">Executive Roadmap</span></div><div class="panelBody" style="display:grid;gap:8px;font-size:10px"><span>◆ Push Notification واقعی با Service Worker و سرور، حتی هنگام بسته بودن صفحه.</span><span>◆ PDF حرفه‌ای با سربرگ برند، لوگو، شماره گزارش و قالب چاپ مدیریتی.</span><span>◆ Excel چند Sheet با جمع‌بندی، فیلتر و خروجی حرفه‌ای.</span><span>◆ داشبوردهای قابل شخصی‌سازی برای مدیر، مالی و فروش.</span><span>◆ Audit Log فقط‌خواندنی برای ثبت مشاهده و خروجی گزارش‌ها.</span></div></div>`}function toggleSound(){const p=getPrefs();setPref('sound',!p.sound);renderSettings()}function playTone(kind='soft'){if(!getPrefs().sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=kind==='success'?740:520;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18)}catch(e){}}function isDueCheck(x){const s=String(x.Status||x.status||'').toLowerCase();if(/سررسید|معوق|برگشت|overdue|due/i.test(s))return true;const d=x.SarDate||x.sarDate;if(!d)return false;const t=Date.parse(String(d));return Number.isFinite(t)&&t<=Date.now()}function notifyBusinessEvents({overdue=0,unpaid=0}){const p=getPrefs(),seen=JSON.parse(localStorage.getItem('mreport-seen-alerts')||'{}'),key=new Date().toISOString().slice(0,10);if(p.overdueChecks&&overdue>0&&seen.overdue!==key){seen.overdue=key;setTimeout(()=>fireReminder({text:`${overdue} چک نیازمند بررسی است.`}),300)}if(p.unpaid&&unpaid>0&&seen.unpaid!==key){seen.unpaid=key;setTimeout(()=>fireReminder({text:`${unpaid} رکورد مطالبات برای پیگیری وجود دارد.`}),500)}localStorage.setItem('mreport-seen-alerts',JSON.stringify(seen))}
function reminders(){return JSON.parse(localStorage.getItem('mreport-reminders')||'[]')}
function saveReminders(a){localStorage.setItem('mreport-reminders',JSON.stringify(a))}
async function requestNotify(){if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}
function addReminder(r){const a=reminders();a.push(r);saveReminders(a);scheduleReminder(r);toast('یادآور ثبت شد')}
function scheduleReminder(r){const delay=new Date(r.when).getTime()-Date.now();if(delay<=0)return;if(delay<2147483647)setTimeout(()=>fireReminder(r),delay)}
function fireReminder(r){if(getPrefs().system||getPrefs().customerReminders){if('Notification' in window&&Notification.permission==='granted')new Notification('M•REPORT — یادآور',{body:r.text});else toast('⏰ '+r.text)}playTone('success')}
async function remindRow(i){if(!getPrefs().customerReminders)return toast('یادآور مشتری خاموش است؛ از تنظیمات آن را روشن کنید');const r=state.rows[i]||{};await requestNotify();const when=prompt('تاریخ و ساعت را وارد کنید (مثلاً 2026-09-08T10:00)');if(!when)return;addReminder({id:Date.now(),when,text:'پیگیری مشتری '+(r.Moname||r.Shmo||'')});}
async function remindCurrent(){if(!getPrefs().customerReminders)return toast('یادآور مشتری خاموش است؛ از تنظیمات آن را روشن کنید');const c=state.current?.customer||{};await requestNotify();const when=prompt('تاریخ و ساعت را وارد کنید (مثلاً 2026-09-08T10:00)');if(!when)return;addReminder({id:Date.now(),when,text:'پیگیری مشتری '+(c.Moname||c.Shmo||'')})}
async function saveCurrentReminder(){if(!getPrefs().customerReminders)return toast('یادآور مشتری خاموش است؛ از تنظیمات آن را روشن کنید');const when=document.getElementById('remDate')?.value;if(!when)return toast('زمان یادآور را انتخاب کنید');await requestNotify();const c=state.current?.customer||{};addReminder({id:Date.now(),when,text:'پیگیری مشتری '+(c.Moname||c.Shmo||'')})}
function openReminders(){const a=reminders();alert(a.length?a.map(x=>new Date(x.when).toLocaleString('fa-IR')+' — '+x.text).join('\n'):'یادآوری ثبت نشده است')}
function initReminderTimers(){reminders().forEach(scheduleReminder)}
function render(){document.documentElement.dataset.fx=getPrefs().effects?'on':'off';if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});if(!state.user)return login();shell();loadSection();initReminderTimers()}render();
</script></body></html>
